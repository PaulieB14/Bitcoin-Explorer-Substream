syntax = "proto3";

package esplora_complete.v1;

// Main output structure that contains all Esplora API data
message EsploraCompleteData {
  // Block information
  BlockInfo block = 1;
  repeated BlockSummary block_summaries = 2;
  repeated TransactionInfo block_transactions = 3;
  
  // Transaction data
  repeated TransactionInfo transactions = 4;
  repeated TransactionHex transaction_hexes = 5;
  repeated TransactionStatus transaction_statuses = 6;
  
  // Address data
  repeated AddressInfo addresses = 7;
  repeated AddressTransaction address_transactions = 8;
  repeated AddressUtxo address_utxos = 9;
  
  // Mempool data
  MempoolInfo mempool = 10;
  repeated MempoolTransaction mempool_recent = 11;
  repeated string mempool_txids = 12;
  
  // Network data
  NetworkTip network_tip = 13;
  repeated FeeEstimate fee_estimates = 14;
  NetworkStats network_stats = 15;
  
  // Search and webhooks
  repeated SearchResult search_results = 16;
  repeated WebhookEvent webhook_events = 17;
  
  // Liquid/Elements data
  repeated AssetInfo assets = 18;
  repeated LiquidAsset liquid_assets = 19;
  repeated PegIn peg_ins = 20;
  repeated PegOut peg_outs = 21;
}

// Block information (GET /block/:hash)
message BlockInfo {
  string id = 1;                    // block hash
  uint32 height = 2;                // block height
  uint32 version = 3;               // block version
  uint64 timestamp = 4;             // block timestamp
  uint32 bits = 5;                  // block bits
  uint32 nonce = 6;                 // block nonce
  uint32 tx_count = 7;              // number of transactions
  uint64 size = 8;                  // block size in bytes
  uint64 weight = 9;                // block weight
  string merkle_root = 10;          // merkle root
  string previous_hash = 11;        // previous block hash
  double difficulty = 12;           // block difficulty
  string mediantime = 13;           // median time
}

// Block summary (GET /blocks)
message BlockSummary {
  string id = 1;                    // block hash
  uint32 height = 2;                // block height
  uint64 timestamp = 3;             // block timestamp
  uint32 tx_count = 4;              // number of transactions
  uint64 size = 5;                  // block size
  uint64 weight = 6;                // block weight
}

// Transaction information (GET /tx/:txid)
message TransactionInfo {
  string txid = 1;                  // transaction ID
  uint32 version = 2;               // transaction version
  uint32 locktime = 3;              // locktime
  uint64 size = 4;                  // transaction size
  uint64 weight = 5;                // transaction weight
  uint64 fee = 6;                   // fee in satoshis
  repeated TxInput inputs = 7;      // transaction inputs
  repeated TxOutput outputs = 8;    // transaction outputs
  TxStatus status = 9;              // transaction status
  repeated string witness = 10;     // witness data
}

// Transaction input
message TxInput {
  string txid = 1;                  // previous transaction ID
  uint32 vout = 2;                  // output index
  bool is_coinbase = 3;             // is coinbase input
  string scriptsig = 4;             // script signature
  string scriptsig_asm = 5;         // script signature asm
  repeated string witness = 6;      // witness data
  uint32 sequence = 7;              // sequence number
  TxOutput prevout = 8;             // previous output
}

// Transaction output
message TxOutput {
  string scriptpubkey = 1;          // script pubkey
  string scriptpubkey_asm = 2;      // script pubkey asm
  string scriptpubkey_type = 3;     // script pubkey type
  string scriptpubkey_address = 4;  // script pubkey address
  uint64 value = 5;                 // value in satoshis
}

// Transaction status
message TxStatus {
  bool confirmed = 1;               // is confirmed
  uint32 block_height = 2;          // block height (if confirmed)
  string block_hash = 3;            // block hash (if confirmed)
  uint64 block_time = 4;            // block time (if confirmed)
}

// Transaction hex
message TransactionHex {
  string txid = 1;                  // transaction ID
  string hex = 2;                   // raw transaction hex
}

// Transaction status
message TransactionStatus {
  string txid = 1;                  // transaction ID
  bool confirmed = 2;               // is confirmed
  uint32 block_height = 3;          // block height (if confirmed)
  string block_hash = 4;            // block hash (if confirmed)
  uint64 block_time = 5;            // block time (if confirmed)
}

// Address information (GET /address/:address)
message AddressInfo {
  string address = 1;               // address
  string address_type = 2;          // address type
  uint64 funded_txo_count = 3;      // funded txo count
  uint64 funded_txo_sum = 4;        // funded txo sum in satoshis
  uint64 spent_txo_count = 5;       // spent txo count
  uint64 spent_txo_sum = 6;         // spent txo sum in satoshis
  uint64 mempool_tx_count = 7;      // mempool tx count
  uint64 mempool_funded_txo_count = 8;  // mempool funded txo count
  uint64 mempool_funded_txo_sum = 9;    // mempool funded txo sum
  uint64 mempool_spent_txo_count = 10;  // mempool spent txo count
  uint64 mempool_spent_txo_sum = 11;    // mempool spent txo sum
  repeated UtxoInfo utxos = 12;     // UTXOs
}

// UTXO information
message UtxoInfo {
  string txid = 1;                  // transaction ID
  uint32 vout = 2;                  // output index
  uint64 value = 3;                 // value in satoshis
  TxStatus status = 4;              // status
}

// Address transaction
message AddressTransaction {
  string address = 1;               // address
  string txid = 2;                  // transaction ID
  uint64 value = 3;                 // value in satoshis
  uint64 fee = 4;                   // fee in satoshis
  uint64 block_height = 5;          // block height
  uint64 block_time = 6;            // block time
}

// Address UTXO
message AddressUtxo {
  string address = 1;               // address
  string txid = 2;                  // transaction ID
  uint32 vout = 3;                  // output index
  uint64 value = 4;                 // value in satoshis
  uint64 block_height = 5;          // block height
  uint64 block_time = 6;            // block time
}

// Mempool information (GET /mempool)
message MempoolInfo {
  uint32 count = 1;                 // transaction count
  uint64 vsize = 2;                 // total vsize
  uint64 total_fee = 3;             // total fee in satoshis
  repeated FeeHistogramEntry fee_histogram = 4;  // fee histogram
}

// Fee histogram entry
message FeeHistogramEntry {
  double feerate = 1;               // fee rate
  uint64 vsize = 2;                 // vsize
}

// Mempool transaction
message MempoolTransaction {
  string txid = 1;                  // transaction ID
  uint64 fee = 2;                   // fee in satoshis
  uint64 vsize = 3;                 // vsize
  uint64 value = 4;                 // value in satoshis
  uint64 time = 5;                  // time
}

// Network tip (GET /blocks/tip/height)
message NetworkTip {
  uint32 height = 1;                // block height
  string hash = 2;                  // block hash
  uint64 timestamp = 3;             // timestamp
}

// Fee estimate
message FeeEstimate {
  uint32 confirmation_target_blocks = 1;  // confirmation target
  double feerate_sat_per_vb = 2;    // fee rate in sat/vB
}

// Network statistics (GET /stats)
message NetworkStats {
  uint32 block_height = 1;          // block height
  string block_hash = 2;            // block hash
  map<string, double> fee_estimates = 3;  // fee estimates
  uint32 mempool_count = 4;         // mempool count
  uint64 mempool_vsize = 5;         // mempool vsize
  uint64 mempool_total_fee = 6;     // mempool total fee
  uint64 total_tx_count = 7;        // total tx count
  uint64 total_fees = 8;            // total fees
  uint32 active_addresses = 9;      // active addresses
  double avg_fee_rate = 10;         // average fee rate
}

// Search result
message SearchResult {
  string query = 1;                 // search query
  string result_type = 2;           // result type
  string result_id = 3;             // result ID
  string description = 4;           // description
}

// Webhook event
message WebhookEvent {
  string event_type = 1;            // event type
  string event_id = 2;              // event ID
  uint64 timestamp = 3;             // timestamp
  string data = 4;                  // event data
}

// Asset information (Liquid/Elements)
message AssetInfo {
  string asset_id = 1;              // asset ID
  uint64 tx_count = 2;              // transaction count
  uint64 peg_in_count = 3;          // peg in count
  uint64 peg_in_amount = 4;         // peg in amount
  uint64 peg_out_count = 5;         // peg out count
  uint64 peg_out_amount = 6;        // peg out amount
  uint64 burn_count = 7;            // burn count
  uint64 burned_amount = 8;         // burned amount
}

// Liquid asset
message LiquidAsset {
  string asset_id = 1;              // asset ID
  string name = 2;                  // asset name
  string ticker = 3;                // asset ticker
  uint64 precision = 4;             // precision
  uint64 tx_count = 5;              // transaction count
  uint64 issued_amount = 6;         // issued amount
  uint64 burned_amount = 7;         // burned amount
  bool reissuable = 8;              // is reissuable
}

// Peg in
message PegIn {
  string txid = 1;                  // transaction ID
  uint64 amount = 2;                // amount
  uint64 block_height = 3;          // block height
  uint64 block_time = 4;            // block time
}

// Peg out
message PegOut {
  string txid = 1;                  // transaction ID
  uint64 amount = 2;                // amount
  uint64 block_height = 3;          // block height
  uint64 block_time = 4;            // block time
}