specVersion: v0.1.0
package:
  name: bitcoin-esplora-enhanced
  version: v0.1.4
  url: https://github.com/PaulieB14/Bitcoin-Explorer-Substream
  description: Enhanced Bitcoin blockchain data processor built on top of substreams-bitcoin-main, providing Esplora API compatible output with real transaction data, addresses, and network statistics.

network: bitcoin

binaries:
  default:
    type: wasm/rust-v1
    file: target/wasm32-unknown-unknown/release/bitcoin_esplora_enhanced.wasm

modules:
  - name: map_block_esplora
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.bitcoin.v1.Block
    output:
      type: proto:sf.substreams.v1.Clock

  - name: map_transactions_esplora
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.bitcoin.v1.Block
    output:
      type: proto:sf.substreams.v1.Clock

  - name: map_addresses_esplora
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.bitcoin.v1.Block
    output:
      type: proto:sf.substreams.v1.Clock

  - name: map_network_stats
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.bitcoin.v1.Block
    output:
      type: proto:sf.substreams.v1.Clock