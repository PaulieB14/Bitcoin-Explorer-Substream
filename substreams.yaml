specVersion: v0.1.0
package:
  name: bitcoin-esplora-enhanced
  version: v0.2.0
  url: https://github.com/PaulieB14/Bitcoin-Explorer-Substream
  description: |
    Enhanced Bitcoin blockchain data processor providing Esplora API compatible output.
    Features: block metadata, transaction details with witness data, address/UTXO tracking,
    network statistics with fee estimates.

network: bitcoin

protobuf:
  files:
    - bitcoin_esplora.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: target/wasm32-unknown-unknown/release/bitcoin_esplora_enhanced.wasm

modules:
  - name: map_block_esplora
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.bitcoin.v1.Block
    output:
      type: proto:bitcoin_esplora.v1.BlockEsplora

  - name: map_transactions_esplora
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.bitcoin.v1.Block
    output:
      type: proto:bitcoin_esplora.v1.TransactionsEsplora

  - name: map_addresses_esplora
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.bitcoin.v1.Block
    output:
      type: proto:bitcoin_esplora.v1.AddressesEsplora

  - name: map_network_stats
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.substreams.v1.Clock
      - source: sf.bitcoin.v1.Block
    output:
      type: proto:bitcoin_esplora.v1.NetworkStats
