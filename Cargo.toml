[package]
name = "bitcoin-esplora-complete"
version = "0.1.0"
edition = "2021"
description = "Complete Bitcoin blockchain data processor mimicking Esplora API functionality"
authors = ["PaulieB14"]
license = "MIT"

[dependencies]
substreams = "0.0.21"
prost = "0.11"
prost-types = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
bech32 = "0.9"

[[bin]]
name = "bitcoin_esplora_complete"
path = "src/main.rs"
